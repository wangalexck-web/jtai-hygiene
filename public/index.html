<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JTAI 衛生巡檢</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Arial; margin: 16px; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 14px; max-width: 720px; }
    label { display:block; margin-top: 12px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; border-radius: 8px; border: 1px solid #bbb; font-size: 16px; }
    textarea { min-height: 90px; }
    .row { display:flex; gap: 10px; }
    .row > div { flex: 1; }
    button { padding: 12px 14px; border: 1px solid #333; background:#fff; border-radius: 10px; cursor:pointer; font-size: 16px; }
    button:disabled { opacity: .5; cursor:not-allowed; }
    .btns { margin-top: 14px; display:flex; gap: 10px; flex-wrap: wrap; }
    .hint { color:#555; font-size: 13px; margin-top: 6px; }
    pre { background:#0b1020; color:#d9e1ff; padding:12px; border-radius:10px; overflow:auto; font-size: 13px; }
    .ok { color: #0a7a2f; font-weight: 700; }
    .bad { color: #b00020; font-weight: 700; }
    a { word-break: break-all; }
    .photos { margin-top: 10px; padding: 10px; border: 1px dashed #aaa; border-radius: 10px; }
  </style>
</head>

<body>
  <div class="card">
    <h1>JTAI 衛生巡檢（含照片上傳）</h1>
    <div class="hint">
      這頁會呼叫 <code>/api/report_submit</code>，回傳會直接顯示在下方 JSON。
    </div>

    <label>場域（site_name）</label>
    <input id="site_name" value="JTAI" />

    <div class="row">
      <div>
        <label>區域（area）</label>
        <input id="area" value="廁所" placeholder="例如：廁所 / 茶水間 / 大廳" />
      </div>
      <div>
        <label>狀態（status）</label>
        <select id="status">
          <option value="OK" selected>OK</option>
          <option value="NG">NG</option>
        </select>
      </div>
    </div>

    <label>備註（note）</label>
    <textarea id="note" placeholder="例如：補充衛生紙、地面乾淨…"></textarea>

    <label>照片（可多選）</label>
    <input id="photos" type="file" accept="image/*" multiple />
    <div class="hint">
      建議：先測 1 張小圖。若照片太大（例如 8~12MB），上傳會比較慢。
    </div>

    <div class="btns">
      <button id="btnSubmit" onclick="submitReport()">送出巡檢（寫入 Supabase）</button>
      <button onclick="clearOut()">清空輸出</button>
    </div>

    <div style="margin-top:12px;">
      <span id="statusText"></span>
    </div>

    <div class="photos" id="photoLinks" style="display:none;"></div>

    <pre id="out">{ "tip": "按下『送出巡檢』後，這裡會顯示 JSON" }</pre>
  </div>

<script>
function setStatus(msg, ok) {
  const el = document.getElementById("statusText");
  el.className = ok ? "ok" : "bad";
  el.textContent = msg || "";
}

function clearOut() {
  document.getElementById("out").textContent = "";
  document.getElementById("photoLinks").style.display = "none";
  document.getElementById("photoLinks").innerHTML = "";
  setStatus("", true);
}

async function fileToBase64(file) {
  return await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const s = String(r.result || "");
      // s: data:image/jpeg;base64,xxxx
      const idx = s.indexOf("base64,");
      resolve(idx >= 0 ? s.slice(idx + 7) : "");
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function submitReport() {
  const btn = document.getElementById("btnSubmit");
  btn.disabled = true;
  setStatus("送出中…", true);

  try {
    const site_name = document.getElementById("site_name").value || "JTAI";
    const area = document.getElementById("area").value;
    const status = document.getElementById("status").value;
    const note = document.getElementById("note").value || "";

    const files = Array.from(document.getElementById("photos")?.files || []);
    const photos = [];
    for (const f of files) {
      const b64 = await fileToBase64(f);
      if (!b64) continue;
      photos.push({
        filename: f.name,
        contentType: f.type || "application/octet-stream",
        dataBase64: b64
      });
    }

    const payload = { site_name, area, status, note, photos };

    const r = await fetch("/api/report_submit", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload)
    });

    const text = await r.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text; }

    document.getElementById("out").textContent = JSON.stringify(data, null, 2);

    if (r.ok && data && data.ok) {
      setStatus("✅ 成功：已寫入巡檢（若有照片，也已上傳）", true);

      // show signed urls (if any)
      const linksBox = document.getElementById("photoLinks");
      linksBox.innerHTML = "";
      if (Array.isArray(data.photos) && data.photos.length) {
        linksBox.style.display = "block";
        linksBox.innerHTML = "<b>照片連結（signed_url，預設有效 1 小時）</b><br/>";
        for (const p of data.photos) {
          const url = p.signed_url;
          if (!url) continue;
          const a = document.createElement("a");
          a.href = url;
          a.target = "_blank";
          a.rel = "noreferrer";
          a.textContent = url;
          linksBox.appendChild(a);
          linksBox.appendChild(document.createElement("br"));
        }
      } else {
        linksBox.style.display = "none";
      }

    } else {
      setStatus("❌ 失敗：請看下方 JSON 的 error / detail", false);
    }

  } catch (e) {
    setStatus("❌ 失敗：" + String(e?.message || e), false);
    document.getElementById("out").textContent = String(e?.stack || e);
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
